<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>婚禮相片與影片分享</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px 16px; margin: 0; background: #f7f8fa; color: #333; }
    .card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); max-width: 440px; margin: 0 auto; text-align: center; }
    h2 { margin-top: 0; font-size: 22px; color: #222; }
    #userName { font-size: 15px; color: #666; margin-bottom: 20px; }
    
    .file-dropzone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 120px;
      border: 2px dashed #d1d5db;
      border-radius: 12px;
      padding: 20px 16px;
      background: #fafafa;
      cursor: pointer;
      margin-bottom: 16px;
      transition: 0.2s;
    }
    .file-dropzone:active { background: #f0f0f0; }
    .file-dropzone svg { display: block; margin-bottom: 8px; }
    .file-dropzone p { margin: 0; font-size: 14px; color: #6b7280; white-space: nowrap; }
    input[type="file"] { display: none; }
    
    .preview-container { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 16px; max-height: 180px; overflow-y: auto; }
    .preview-container img, .preview-container video { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid #eee; }
    
    .btn { display: block; width: 100%; padding: 14px; background: #06C755; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn:disabled { background: #cbd5e1; cursor: not-allowed; }
    .btn-close { background: #4b5563; margin-top: 10px; display: none; }
    
    .progress-box { margin-top: 20px; display: none; }
    .progress-bar-bg { background: #e5e7eb; border-radius: 8px; height: 10px; overflow: hidden; margin-bottom: 8px; }
    .progress-bar-fill { background: #06C755; height: 100%; width: 0%; transition: width 0.2s ease; }
    .status-text { font-size: 14px; color: #4b5563; margin-top: 6px; }
  </style>
</head>
<body>

<div class="card">
  <h2>分享婚禮相片與短影片 ❤️</h2>
  <p id="userName">載入使用者資訊中...</p>
  
  <label class="file-dropzone" for="filePicker" id="dropzone">
    <svg width="32" height="32" fill="none" stroke="#9ca3af" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
    <p id="dropzoneText">點擊挑選照片或短影片 (可多選)</p>
  </label>
  <!-- 支援圖片與影片選取 -->
  <input type="file" id="filePicker" multiple accept="image/*,video/*">

  <div class="preview-container" id="previewContainer"></div>

  <button id="uploadBtn" class="btn" disabled>開始上傳</button>

  <div class="progress-box" id="progressBox">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
    <div class="status-text" id="statusText">準備中...</div>
  </div>

  <button id="closeBtn" class="btn btn-close">關閉並回到聊天室</button>
</div>

<script>
  const LIFF_ID = "2012423151-rJrXnLMN"; // 請填入你的真實 LIFF ID
  const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbzSUQ9MES6XQ-rrEKGd7NwE_F_svuSZcPBbhtQmWHGtIH_z8embQqKq81Azbo5kpI7f7w/exec"; // 請填入你的 GAS Web App URL
  const MAX_VIDEO_SIZE = 30 * 1024 * 1024; // 影片上限 30MB
  let lineProfile = null;
  let selectedFiles = [];

  async function initLiff() {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }
      lineProfile = await liff.getProfile();
      document.getElementById('userName').innerText = `哈囉，${lineProfile.displayName}！選好即可上傳：`;
    } catch (err) {
      document.getElementById('userName').innerText = '載入失敗：' + err;
    }
  }

  // 監聽選檔並生成預覽
  document.getElementById('filePicker').addEventListener('change', function(e) {
    selectedFiles = Array.from(e.target.files);
    const previewContainer = document.getElementById('previewContainer');
    const dropzoneText = document.getElementById('dropzoneText');
    const uploadBtn = document.getElementById('uploadBtn');

    previewContainer.innerHTML = '';

    if (selectedFiles.length > 0) {
      dropzoneText.innerText = `已選擇 ${selectedFiles.length} 個檔案 (點此更換)`;
      uploadBtn.disabled = false;

      selectedFiles.forEach(file => {
        if (file.type.startsWith('video/')) {
          const vid = document.createElement('video');
          vid.src = URL.createObjectURL(file);
          previewContainer.appendChild(vid);
        } else {
          const img = document.createElement('img');
          img.src = URL.createObjectURL(file);
          previewContainer.appendChild(img);
        }
      });
    } else {
      dropzoneText.innerText = '點擊挑選照片或短影片 (可多選)';
      uploadBtn.disabled = true;
    }
  });

  // 上傳核心
  document.getElementById('uploadBtn').addEventListener('click', async () => {
    if (selectedFiles.length === 0) return;

    const uploadBtn = document.getElementById('uploadBtn');
    const filePicker = document.getElementById('filePicker');
    const dropzone = document.getElementById('dropzone');
    const progressBox = document.getElementById('progressBox');
    const progressBar = document.getElementById('progressBar');
    const statusText = document.getElementById('statusText');
    const closeBtn = document.getElementById('closeBtn');

    uploadBtn.disabled = true;
    filePicker.disabled = true;
    dropzone.style.pointerEvents = 'none';
    progressBox.style.display = 'block';

    const total = selectedFiles.length;
    let completed = 0;

    // 單檔處理與上傳函式
    async function processAndUpload(file, index) {
      // 影片大小檢查
      if (file.type.startsWith('video/') && file.size > MAX_VIDEO_SIZE) {
        statusText.innerText = `檔案「${file.name}」超過 30MB 已略過`;
        completed++;
        return;
      }

      statusText.innerText = `正在處理第 ${index + 1} / ${total} 個檔案...`;

      let base64Data = '';
      let mimeType = file.type;
      let finalName = file.name;

      // 圖片走輕量化壓縮加速，影片直接讀取
      if (file.type.startsWith('image/')) {
        base64Data = await compressImageToBase64(file);
        mimeType = 'image/jpeg';
        if (!finalName.toLowerCase().endsWith('.jpg') && !finalName.toLowerCase().endsWith('.jpeg')) {
          finalName += '.jpg';
        }
      } else {
        base64Data = await fileToBase64(file);
      }

      const payload = {
        action: 'upload_file',
        base64: base64Data.split(',')[1],
        mimeType: mimeType,
        fileName: `${lineProfile ? lineProfile.displayName : 'Guest'}_${Date.now()}_${finalName}`
      };

      try {
        await fetch(GAS_WEBAPP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        console.error('上傳錯誤', err);
      }

      completed++;
      const percent = Math.round((completed / total) * 100);
      progressBar.style.width = percent + '%';
      statusText.innerText = `已完成 ${completed} / ${total} (${percent}%)`;
    }

    // 併發控制器（每次同時跑 2 個請求，兼顧速度與手機穩定度）
    const concurrency = 2;
    for (let i = 0; i < selectedFiles.length; i += concurrency) {
      const chunk = selectedFiles.slice(i, i + concurrency);
      await Promise.all(chunk.map((file, idx) => processAndUpload(file, i + idx)));
    }

    progressBar.style.width = '100%';
    statusText.innerText = '所有相片/影片已成功上傳！感謝你的分享 ❤️';
    uploadBtn.style.display = 'none';
    closeBtn.style.display = 'block';
  });

  // 前端圖片無損等比縮放壓縮 (長邊 2560px, JPEG 85% 品質)
  function compressImageToBase64(file) {
    return new Promise((resolve) => {
      const img = new Image();
      img.src = URL.createObjectURL(file);
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        const maxSide = 2560; // 2.5K 超清解析度

        if (width > maxSide || height > maxSide) {
          if (width > height) {
            height = Math.round((height * maxSide) / width);
            width = maxSide;
          } else {
            width = Math.round((width * maxSide) / height);
            height = maxSide;
          }
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        URL.revokeObjectURL(img.src);
        resolve(dataUrl);
      };
      img.onerror = () => {
        // 若壓縮失敗則退回原檔讀取
        fileToBase64(file).then(resolve);
      };
    });
  }

  // 影片原生讀取
  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = (error) => reject(error);
      reader.readAsDataURL(file);
    });
  }

  document.getElementById('closeBtn').addEventListener('click', () => {
    if (liff.isInClient()) {
      liff.closeWindow();
    } else {
      window.close();
    }
  });

  initLiff();
</script>
</body>
</html>
